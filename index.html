<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Samar's Grad School Mission Control</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0c1420;
    --panel: #121d2c;
    --panel-2: #16223333;
    --panel-raised: #17253699;
    --line: #24344a;
    --line-soft: #1b2839;
    --text: #e8eef6;
    --text-dim: #93a4bb;
    --text-faint: #5f7089;
    --amber: #e3a545;
    --cyan: #55c2d6;
    --green: #6fd39a;
    --red: #e2687e;
    --violet: #a48bf0;
    --radius: 10px;
    --mono: 'IBM Plex Mono', monospace;
    --sans: 'Inter', sans-serif;
    --display: 'Space Grotesk', sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: radial-gradient(1200px 600px at 15% -10%, #16243a 0%, transparent 60%), var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.5;
    min-height: 100vh;
  }
  ::selection{ background: var(--cyan); color:#04141a; }
  a{ color: var(--cyan); }

  /* ---------- Layout ---------- */
  #app{ display:flex; min-height:100vh; }

  .sidebar{
    width: 236px; flex: none;
    background: linear-gradient(180deg, #0e1826, #0a121d);
    border-right: 1px solid var(--line-soft);
    padding: 22px 14px;
    position: sticky; top:0; height:100vh; overflow-y:auto;
  }
  .brand{
    font-family: var(--display); font-weight:700; font-size:15px;
    letter-spacing: .01em; color: var(--text); padding: 0 8px 4px;
  }
  .brand small{ display:block; font-family: var(--mono); font-weight:400; font-size:10.5px; color: var(--text-faint); margin-top:4px; letter-spacing:.02em;}
  .nav{ margin-top: 26px; display:flex; flex-direction:column; gap:2px; }
  .nav-item{
    display:flex; align-items:center; gap:10px;
    padding: 9px 10px; border-radius: 8px; cursor:pointer;
    color: var(--text-dim); font-size: 13.5px; font-weight:500;
    border: 1px solid transparent;
    user-select:none;
  }
  .nav-item:hover{ background: #ffffff08; color:var(--text); }
  .nav-item.active{ background:#ffffff0d; color: var(--text); border-color: var(--line); }
  .nav-item .dot{ width:6px; height:6px; border-radius:50%; background: var(--text-faint); flex:none; }
  .nav-item.active .dot{ background: var(--cyan); box-shadow: 0 0 8px var(--cyan); }
  .nav-count{ margin-left:auto; font-family: var(--mono); font-size: 11px; color: var(--text-faint); }

  .sidebar-foot{ margin-top: 28px; padding: 12px 10px; border-top: 1px solid var(--line-soft); }
  .sidebar-foot .label{ font-size:10.5px; text-transform:none; color:var(--text-faint); font-family: var(--mono); }
  .save-indicator{ display:flex; align-items:center; gap:6px; margin-top:8px; font-size:12px; color:var(--text-dim); }
  .save-dot{ width:6px;height:6px;border-radius:50%; background: var(--green); }
  .save-dot.saving{ background: var(--amber); animation: pulse 1s infinite; }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:.35;} }

  .main{ flex:1; min-width:0; padding: 30px 34px 80px; max-width: 1180px; }
  .page-head{ margin-bottom: 22px; }
  .page-head h1{ font-family: var(--display); font-size: 23px; margin:0 0 6px; font-weight:700; }
  .page-head p{ margin:0; color: var(--text-dim); font-size: 13.5px; max-width: 640px;}

  /* ---------- Cards / KPIs ---------- */
  .kpi-row{ display:grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 22px; }
  .kpi{
    background: var(--panel); border:1px solid var(--line-soft); border-radius: var(--radius);
    padding: 14px 16px;
  }
  .kpi .num{ font-family: var(--mono); font-size: 26px; font-weight:600; color:var(--text); }
  .kpi .lbl{ font-size: 12px; color: var(--text-dim); margin-top:2px; }
  .kpi .sub{ font-size: 11px; color: var(--text-faint); margin-top:6px; }

  .panel{
    background: var(--panel); border:1px solid var(--line-soft); border-radius: var(--radius);
    padding: 18px; margin-bottom: 18px;
  }
  .panel h2{ font-family: var(--display); font-size: 15px; margin: 0 0 12px; font-weight:600; display:flex; align-items:center; gap:8px;}
  .panel h2 .n{ font-family: var(--mono); color: var(--text-faint); font-weight:400; font-size:12px; }

  .two-col{ display:grid; grid-template-columns: 1.3fr 1fr; gap: 16px; align-items:start; }
  @media (max-width: 900px){ .two-col{ grid-template-columns: 1fr; } .kpi-row{ grid-template-columns: repeat(2,1fr);} }

  .todo-item{ display:flex; gap:10px; align-items:flex-start; padding: 9px 0; border-bottom: 1px solid var(--line-soft); font-size:13px;}
  .todo-item:last-child{ border-bottom:none; }
  .todo-tag{ font-family:var(--mono); font-size:10px; padding:2px 6px; border-radius:5px; flex:none; margin-top:1px; }
  .tag-portal{ background:#3a2c15; color:var(--amber); }
  .tag-doc{ background:#182f3d; color:var(--cyan); }
  .tag-test{ background:#2a1f3d; color:var(--violet); }
  .tag-deadline{ background:#3a1c22; color:var(--red); }

  .ring-wrap{ display:flex; align-items:center; gap:16px; }
  .ring{ flex:none; }
  .ring-label{ font-size:12px; color:var(--text-dim); }
  .ring-label b{ display:block; color:var(--text); font-family:var(--mono); font-size:20px; font-weight:600; }

  /* ---------- Controls ---------- */
  .toolbar{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom: 14px; }
  input[type=text].search{
    background: var(--panel); border:1px solid var(--line); color:var(--text);
    padding: 8px 12px; border-radius: 8px; font-size:13px; width: 230px; font-family: var(--sans);
  }
  input[type=text].search::placeholder{ color: var(--text-faint); }
  select, input[type=date], input[type=number], textarea, input[type=text].field, input[type=url]{
    background: #0e1826; border:1px solid var(--line); color:var(--text);
    padding: 6px 9px; border-radius: 7px; font-size: 12.5px; font-family: var(--sans);
  }
  select:focus, input:focus, textarea:focus{ outline: 1.5px solid var(--cyan); border-color: var(--cyan); }
  .chip-toggle{
    display:flex; gap:6px; flex-wrap:wrap;
  }
  .chip{
    padding: 6px 11px; border-radius: 999px; border:1px solid var(--line); color: var(--text-dim);
    font-size:12px; cursor:pointer; user-select:none; background:transparent;
  }
  .chip:hover{ border-color: var(--text-faint); color: var(--text); }
  .chip.active{ background: var(--cyan); color:#04141a; border-color: var(--cyan); font-weight:600; }
  .spacer{ flex:1; }
  .btn{
    background: var(--cyan); color:#04141a; border:none; padding: 7px 13px; border-radius:7px;
    font-weight:600; font-size:12.5px; cursor:pointer; font-family:var(--sans);
  }
  .btn:hover{ filter:brightness(1.08); }
  .btn.ghost{ background:transparent; border:1px solid var(--line); color: var(--text-dim); }
  .btn.ghost:hover{ color:var(--text); border-color:var(--text-faint); }
  .btn.small{ padding: 4px 9px; font-size:11.5px; }
  .btn.danger{ background: transparent; border:1px solid #4a2530; color: var(--red); }

  /* ---------- Program cards ---------- */
  .program-list{ display:flex; flex-direction:column; gap:10px; }
  .program-card{
    background: var(--panel); border:1px solid var(--line-soft); border-radius: var(--radius);
    overflow:hidden;
  }
  .program-head{
    display:flex; align-items:center; gap:12px; padding: 13px 16px; cursor:pointer;
  }
  .program-head:hover{ background:#ffffff05; }
  .uni-name{ font-weight:600; font-size:14px; color:var(--text); }
  .prog-name{ font-size:12.5px; color: var(--text-dim); margin-top:1px; }
  .status-pill{
    font-family: var(--mono); font-size: 10.5px; padding: 4px 9px; border-radius: 999px;
    text-transform:none; flex:none; white-space:nowrap; border:1px solid transparent;
  }
  .st-Wishlist{ background:#1b2839; color:var(--text-dim); border-color:var(--line); }
  .st-Preparing{ background:#3a2c15; color:var(--amber); border-color:#5a4520; }
  .st-Submitted{ background:#132c3a; color:var(--cyan); border-color:#1f4c5c; }
  .st-Interview{ background:#2a1f3d; color:var(--violet); border-color:#3f2f5c; }
  .st-Offer{ background:#173a29; color:var(--green); border-color:#245c3f; }
  .st-Accepted{ background:#173a29; color:var(--green); border-color:var(--green); }
  .st-Rejected{ background:#3a1c22; color:var(--red); border-color:#5c2a34; }
  .st-Declined{ background:#1b2839; color:var(--text-faint); border-color:var(--line); }

  .portal-flag{ font-size:11px; font-family:var(--mono); padding:3px 8px; border-radius:6px; flex:none; white-space:nowrap;}
  .pf-open{ background:#173a29; color:var(--green); }
  .pf-soon{ background:#3a2c15; color:var(--amber); }
  .pf-none{ background:#1b2839; color:var(--text-faint); }

  .mini-progress{ width:56px; height:5px; background:#1b2839; border-radius:3px; overflow:hidden; flex:none; }
  .mini-progress i{ display:block; height:100%; background: var(--cyan); }

  .chev{ color: var(--text-faint); transition: transform .15s ease; flex:none; }
  .program-card.open .chev{ transform: rotate(90deg); }

  .program-body{ display:none; padding: 4px 16px 18px; border-top:1px solid var(--line-soft); }
  .program-card.open .program-body{ display:block; }

  .field-grid{ display:grid; grid-template-columns: repeat(3, 1fr); gap: 12px 16px; margin-top:14px; }
  @media (max-width: 760px){ .field-grid{ grid-template-columns: 1fr 1fr; } }
  .field{ display:flex; flex-direction:column; gap:5px; }
  .field label{ font-size: 10.5px; color: var(--text-faint); font-family:var(--mono); text-transform:none; }
  .field .readout{ font-size:13px; color:var(--text); }

  .tag-row{ display:flex; gap:6px; flex-wrap:wrap; margin-top: 10px; }
  .tag{ font-size:11px; padding:3px 8px; border-radius:6px; background:#1b2839; color:var(--text-dim); border:1px solid var(--line); }
  .tag.req{ color: var(--violet); border-color:#3f2f5c; background:#221a33; }
  .tag.sch{ color: var(--amber); border-color:#5a4520; background:#2a2010; cursor:default; }

  textarea.notes{ width:100%; min-height: 54px; resize:vertical; margin-top:10px; font-size:12.5px; }

  /* ---------- Documents ---------- */
  .doc-grid{ display:grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  @media (max-width: 820px){ .doc-grid{ grid-template-columns: 1fr; } }
  .doc-card{ background: var(--panel); border:1px solid var(--line-soft); border-radius: var(--radius); padding: 14px 16px; }
  .doc-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
  .doc-name{ font-weight:600; font-size:13.5px; }
  .doc-type{ font-size:10.5px; color:var(--text-faint); font-family:var(--mono); margin-top:2px;}
  .doc-scope{ font-size:11px; color:var(--text-faint); margin-top:8px; }
  .doc-controls{ display:flex; gap:8px; margin-top:10px; align-items:center; }

  /* ---------- Scholarships ---------- */
  .sch-card{ background: var(--panel); border:1px solid var(--line-soft); border-radius: var(--radius); padding: 14px 16px; margin-bottom:10px; }
  .sch-head{ display:flex; justify-content:space-between; gap:10px; align-items:flex-start; flex-wrap:wrap; }
  .sch-name{ font-weight:600; font-size:14px; }
  .sch-note{ font-size:12px; color: var(--text-dim); margin-top:4px; max-width:560px; }
  .sch-grid{ display:grid; grid-template-columns: repeat(4,1fr); gap:10px 14px; margin-top:12px; }
  @media (max-width: 900px){ .sch-grid{ grid-template-columns: repeat(2,1fr);} }

  .resp-Not-Applied{ color: var(--text-dim); }
  .resp-Preparing{ color: var(--amber); }
  .resp-Applied{ color: var(--cyan); }
  .resp-Awaiting-Decision{ color: var(--violet); }
  .resp-Awarded{ color: var(--green); }
  .resp-Rejected{ color: var(--red); }

  /* ---------- Contacts ---------- */
  .contact-card{ background: var(--panel); border:1px solid var(--line-soft); border-radius: var(--radius); padding:14px 16px; margin-bottom:10px; display:flex; gap:14px; flex-wrap:wrap; align-items:flex-start;}
  .avatar{ width:38px;height:38px;border-radius:50%; background: linear-gradient(135deg,var(--cyan),var(--violet)); display:flex;align-items:center;justify-content:center; font-family:var(--display); font-weight:700; color:#04141a; flex:none;}

  /* ---------- Guide ---------- */
  .guide-item{ padding: 12px 0; border-bottom:1px solid var(--line-soft); }
  .guide-item:last-child{ border-bottom:none; }
  .guide-item h3{ margin:0 0 4px; font-size:13.5px; font-family:var(--display); }
  .guide-item p{ margin:0; font-size:13px; color: var(--text-dim); }

  .empty{ text-align:center; color: var(--text-faint); padding: 40px 0; font-size:13px; }

  ::-webkit-scrollbar{ width:9px; height:9px; }
  ::-webkit-scrollbar-thumb{ background:#22344a; border-radius:6px; }
  ::-webkit-scrollbar-track{ background:transparent; }

  @media (max-width: 700px){
    .sidebar{ display:none; }
    .main{ padding: 18px 16px 60px; }
    .kpi-row{ grid-template-columns: repeat(2,1fr); }
  }
</style>
</head>
<body>
<div id="app">
  <div class="sidebar">
    <div class="brand">Mission Control<small>MSc Robotics &amp; AI · Samar Saleh</small></div>
    <div class="nav" id="nav"></div>
    <div class="sidebar-foot">
      <div class="label">STATUS</div>
      <div class="save-indicator"><div class="save-dot" id="saveDot"></div><span id="saveText">Synced</span></div>
      <div style="margin-top:14px; display:flex; flex-direction:column; gap:6px;">
        <button class="btn ghost small" id="exportBtn" style="width:100%;">⭳ Export backup</button>
        <button class="btn ghost small" id="importBtn" style="width:100%;">⭱ Import backup</button>
        <input type="file" id="importFile" accept="application/json" style="display:none;">
        <div style="font-size:10.5px; color:var(--text-faint); margin-top:2px; line-height:1.4;">
          Export downloads your data as one file. Bring it to another laptop and Import to restore everything there.
        </div>
      </div>
    </div>
  </div>
  <div class="main" id="main"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

// One Firestore document holds every key. Reading fetches that whole document;
// writing merges just the changed field so nothing else is overwritten.
let firestoreDb = null;
function firestoreDocRef(){ return firestoreDb.collection("gradtracker").doc("samar"); }

function initFirebase(){
  try{
    if (typeof firebase === "undefined") return; // SDK script didn't load (offline, blocked, etc.)
    if (!firebase.apps || !firebase.apps.length) firebase.initializeApp(firebaseConfig);
    firestoreDb = firebase.firestore();
  }catch(e){
    console.error("Firebase init failed — falling back to local storage.", e);
    firestoreDb = null;
  }
}
initFirebase();

// Storage backend, tried in this order:
//   1. Claude's own artifact storage (only present when viewed inside claude.ai)
//   2. Firestore (your live, cross-device database)
//   3. This browser's localStorage (last-resort fallback if Firestore can't load)
const storageBackend = (function(){
  if (window.storage && typeof window.storage.get === "function") {
    return window.storage;
  }
  if (firestoreDb) {
    return {
      async get(key){
        const snap = await firestoreDocRef().get();
        const data = snap.exists ? snap.data() : {};
        if (!(key in data)) throw new Error("not found: " + key);
        return { key, value: data[key] };
      },
      async set(key, value){
        await firestoreDocRef().set({ [key]: value }, { merge: true });
        return { key, value };
      }
    };
  }
  return {
    async get(key){
      const raw = localStorage.getItem("gradtrack::" + key);
      if (raw === null) throw new Error("not found: " + key);
      return { key, value: raw };
    },
    async set(key, value){
      localStorage.setItem("gradtrack::" + key, value);
      return { key, value };
    }
  };
})();

/* ============================================================
   HELPERS
   ============================================================ */

function daysUntil(iso){
  if(!iso) return null;
  const d = new Date(iso+"T00:00:00");
  return Math.round((d - TODAY) / 86400000);
}
function fmtDate(iso){
  if(!iso) return "";
  const d = new Date(iso+"T00:00:00");
  return d.toLocaleDateString("en-GB",{ day:"numeric", month:"short", year:"numeric" });
}
function esc(s){
  return String(s||"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function slug(id){ return id.replace(/[^a-zA-Z0-9_]/g,""); }
function statusClass(status){
  const map = { "Offer":"st-Offer" };
  return "st-" + (map[status] || status.replace(/\s+/g,""));
}
function docCompleteness(){
  const core = getAllDocs().filter(d=>d.core);
  const ready = core.filter(d=>getDoc(d).status === "Ready").length;
  return { ready, total: core.length, pct: core.length ? Math.round(ready/core.length*100) : 0 };
}
function portalState(p){
  if(p.portalUrl || progOverride(p.id).portalUrlOverride) return "open";
  if(p.portalOpen){ return daysUntil(p.portalOpen) <= 0 ? "open-now" : "soon"; }
  return "none";
}

      <div class="panel">
        <h2>Document readiness</h2>

function schChips(ids){
  return ids.map(id=>{
    const s = getAllScholarships().find(x=>x.id===id);
    return s ? `<span class="tag sch">${esc(s.name)}</span>` : "";
  }).join("");
}

function renderPrograms(){
  const search = ui.search.toLowerCase();
  let list = getAllPrograms().filter(p=>{
    const g = getProgram(p);
    if(ui.statusFilter !== "All" && g.status !== ui.statusFilter) return false;
    if(search && !(p.uni.toLowerCase().includes(search) || p.program.toLowerCase().includes(search))) return false;
    return true;
  });

  document.getElementById("main").innerHTML = `
    <div class="page-head">
      <h1>Programs</h1>
      <p>Click a row to expand it. Every field you change is saved automatically.</p>
    </div>
    <div class="toolbar">
      <input type="text" class="search" id="progSearch" placeholder="Search university or program…" value="${esc(ui.search)}">
      <div class="chip-toggle" id="statusChips">
        ${["All",...STATUS_OPTIONS].map(s=>`<div class="chip ${ui.statusFilter===s?'active':''}" data-status="${s}">${s}</div>`).join("")}
      </div>
      <div class="spacer"></div>
      <span style="font-size:12px; color:var(--text-faint); font-family:var(--mono);">${list.length} shown</span>
      <button class="btn small" id="addProgram">+ Add program</button>
    </div>
    <div class="program-list" id="progList">
      ${list.length ? list.map(renderProgramCard).join("") : `<div class="empty">No programs match that filter.</div>`}
    </div>
  `;

  document.getElementById("addProgram").addEventListener("click", ()=>{
    const id = "cp_" + Date.now();
    overrides.customPrograms.push({
      id, uni:"New University", program:"New Program", status:"Wishlist",
      portalUrl:"", portalNote:"", portalOpen:null, moi:null, duo:null, ellt:null, notes:""
    });
    persist("customPrograms");
    ui.openProgram = id;
    renderPrograms();
  });

  document.getElementById("progSearch").addEventListener("input", e=>{ ui.search = e.target.value; renderPrograms(); });
  document.getElementById("statusChips").querySelectorAll(".chip").forEach(el=>{
    el.addEventListener("click", ()=>{ ui.statusFilter = el.dataset.status; renderPrograms(); });
  });

  document.querySelectorAll(".program-head").forEach(el=>{
    el.addEventListener("click", ()=>{
      const id = el.dataset.id;
      ui.openProgram = ui.openProgram === id ? null : id;
      renderPrograms();
    });
  });

  wireProgramInputs();
}

function renderProgramCard(p){

  const isOpen = ui.openProgram === p.id;
  let portalBadge = `<span class="portal-flag pf-none">no portal yet</span>`;
  if(pstate === "open" || pstate === "open-now") portalBadge = `<span class="portal-flag pf-open">portal open</span>`;
  if(pstate === "soon") portalBadge = `<span class="portal-flag pf-soon">opens in ${daysUntil(p.portalOpen)}d</span>`;

  const reqTags = [];
  if(p.duo) reqTags.push(`<span class="tag req">Duolingo ${p.duo}${g.actualDuo?` · you: ${esc(g.actualDuo)}`:''}</span>`);
  if(p.ellt) reqTags.push(`<span class="tag req">Oxford ELLT ${p.ellt}${g.actualEllt?` · you: ${esc(g.actualEllt)}`:''}</span>`);
  if(p.moi) reqTags.push(`<span class="tag req">MOI: ${esc(g.moiStatus||p.moi)}</span>`);

  const portalUrl = progOverride(p.id).portalUrlOverride || p.portalUrl;
  const custom = isCustom(p.id);
  const progSchs = getProgramScholarships(p);

  return `
  <div class="program-card ${isOpen?'open':''}">
    <div class="program-head" data-id="${p.id}">
      <svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div style="flex:1; min-width:0;">
        <div class="uni-name">${esc(p.uni)}</div>
        <div class="prog-name">${esc(p.program)}</div>
      </div>
      ${portalBadge}
      <span class="status-pill ${statusClass(g.status)}" id="status-pill-${p.id}">${g.status}</span>
    </div>
    <div class="program-body">
      ${custom ? `
      <div class="field-grid" style="margin-top:14px;">
        <div class="field"><label>University name</label>
          <input type="text" class="field" data-custom-field="uni" data-id="${p.id}" value="${esc(p.uni)}"></div>
        <div class="field"><label>Program name</label>
          <input type="text" class="field" data-custom-field="program" data-id="${p.id}" value="${esc(p.program)}"></div>
      </div>` : ""}
      <div class="tag-row">${reqTags.join("") || `<span class="tag">No English test / MOI condition on file</span>`}</div>
      ${progSchs.length ? `<div class="tag-row">${schChips(progSchs.map(s=>s.id))}</div>` : ""}

      <div class="field-grid">
        <div class="field">
          <label>Status</label>
          <select data-field="status" data-id="${p.id}">
            ${STATUS_OPTIONS.map(s=>`<option value="${s}" ${g.status===s?'selected':''}>${s}</option>`).join("")}
          </select>
        </div>
        <div class="field">
          <label>Priority</label>
          <select data-field="priority" data-id="${p.id}">
            <option value="">—</option>
            ${PRIORITY_OPTIONS.map(s=>`<option value="${s}" ${g.priority===s?'selected':''}>${s}</option>`).join("")}
          </select>
        </div>
        <div class="field">
          <label>Application deadline</label>
          <input type="date" data-field="deadline" data-id="${p.id}" value="${g.deadline||''}">
        </div>

        <div class="field" id="portal-field-${p.id}">
          <label>Application portal</label>
          ${portalUrl
            ? `<button class="btn small" onclick="window.open('${portalUrl.replace(/'/g,"%27")}','_blank')">Open portal ↗</button>`
            : `<input type="url" class="field" placeholder="Paste portal link once you find it" data-field="portalUrlOverride" data-id="${p.id}" value="${esc(g.portalUrlOverride)}">`
          }
          ${p.portalNote ? `<span style="font-size:11px; color:var(--text-faint); margin-top:2px;">${esc(p.portalNote)}</span>` : ""}
        </div>
        <div class="field">
          <label>Duolingo — your score</label>
          <input type="number" data-field="actualDuo" data-id="${p.id}" value="${esc(g.actualDuo)}" placeholder="${p.duo?('target '+p.duo):'not required'}">
        </div>
        <div class="field">
          <label>Oxford ELLT — your band</label>
          <input type="number" data-field="actualEllt" data-id="${p.id}" value="${esc(g.actualEllt)}" placeholder="${p.ellt?('target '+p.ellt):'not required'}">
        </div>

        <div class="field">
          <label>MOI status</label>
          <select data-field="moiStatus" data-id="${p.id}">
            ${["", "Yes","Maybe","Highly Maybe","No","N/A"].map(s=>`<option value="${s}" ${((g.moiStatus||"")===s)?'selected':''}>${s||"—"}</option>`).join("")}
          </select>
        </div>
        <div class="field">
          <label>Application fee</label>
          <input type="text" data-field="fee" data-id="${p.id}" value="${esc(g.fee)}" placeholder="e.g. £75">
        </div>
        <div class="field">
          <label>Personal statement — tailored version</label>
          <select data-field="psStatus" data-id="${p.id}">
            ${PS_TAILOR_OPTIONS.map(s=>`<option value="${s}" ${g.psStatus===s?'selected':''}>${s}</option>`).join("")}
          </select>
        </div>
      </div>

      <textarea class="notes" data-field="notes" data-id="${p.id}" placeholder="Notes for ${esc(p.uni)}…">${esc(g.notes)}</textarea>
      <div style="margin-top:12px;">
        <button class="btn danger small" data-remove-program="${p.id}">Remove this program</button>
      </div>
    </div>
  </div>`;
}

function wireProgramInputs(){
  document.querySelectorAll("#progList [data-field][data-id]").forEach(el=>{
    const evt = (el.tagName === "SELECT" || el.type === "date") ? "change" : "input";
    el.addEventListener(evt, ()=>{
      const id = el.dataset.id, field = el.dataset.field;
      if(!overrides.programs[id]) overrides.programs[id] = {};
      overrides.programs[id][field] = el.value;
      persist("programs");

      // Patch only the specific bit of UI that depends on this field —
      // never tear down the control the user is actively interacting with.
      if(field === "status"){
        const pill = document.getElementById("status-pill-"+id);
        if(pill){ pill.textContent = el.value; pill.className = "status-pill " + statusClass(el.value); }
      } else if(field === "portalUrlOverride"){
        const wrap = document.getElementById("portal-field-"+id);
        if(wrap && el.value){
          const p = getAllPrograms().find(x=>x.id===id);
          wrap.innerHTML = `<label>Application portal</label>
            <button class="btn small" onclick="window.open('${el.value.replace(/'/g,"%27")}','_blank')">Open portal ↗</button>
            ${p.portalNote ? `<span style="font-size:11px; color:var(--text-faint); margin-top:2px;">${esc(p.portalNote)}</span>` : ""}`;
        }
      }
      // deadline, actualDuo, actualEllt, moiStatus, fee, psStatus, notes: value is
      // already reflected in the control itself — nothing else on this page shows it.
    });
  });

  document.querySelectorAll("#progList [data-custom-field][data-id]").forEach(el=>{
    el.addEventListener("input", ()=>{
      const cp = overrides.customPrograms.find(x=>x.id===el.dataset.id);
      if(cp){
        cp[el.dataset.customField] = el.value;
        persist("customPrograms");
        const card = el.closest(".program-card");
        if(card){
          card.querySelector(".uni-name").textContent = cp.uni;
          card.querySelector(".prog-name").textContent = cp.program;
        }
      }
    });
  });

  document.querySelectorAll("#progList [data-remove-program]").forEach(el=>{
    el.addEventListener("click", ()=>{
      const id = el.dataset.removeProgram;
      const p = getAllPrograms().find(x=>x.id===id);
      if(!confirm(`Remove ${p ? p.uni + " — " + p.program : "this program"}? This can't be undone.`)) return;
      if(isCustom(id)){
        overrides.customPrograms = overrides.customPrograms.filter(x=>x.id!==id);
        persist("customPrograms");
      } else {
        overrides.removed.programs.push(id);
        persist("removed");
      }
      ui.openProgram = null;
      renderPrograms();
    });
  });
}

    <div class="panel">
      <h2>Personal statement — tailoring by program <span class="n">not counted in the ring below</span></h2>
      <p style="color:var(--text-dim); font-size:12.5px; margin:0 0 10px;">
        The general draft here is the shared narrative every version starts from. Each of your ${getAllPrograms().length} programs needs its own tailored paragraph — track that per-program on the <a href="#" id="goToPrograms" style="color:var(--cyan);">Programs tab</a>.

      </div>

      <h2>Required <span class="n">counts toward readiness</span></h2>
      <div class="doc-grid">${requiredDocs.map(renderDocCard).join("")}</div>
    </div>

    <div class="panel">
      <h2>Optional / program-specific <span class="n">tracked, not counted</span></h2>
      <div class="doc-grid">${optionalDocs.map(renderDocCard).join("")}</div>
      <button class="btn ghost small" id="addDoc" style="margin-top:10px;">+ Add document</button>
    </div>
  `;
  document.getElementById("goToPrograms").addEventListener("click", e=>{ e.preventDefault(); ui.tab="programs"; render(); });
  document.getElementById("addDoc").addEventListener("click", ()=>{
    const id = "cd_" + Date.now();
    overrides.customDocs.push({ id, name:"New document", type:"Other", scope:"", defaultStatus:"Not Started", defaultNotes:"", core:false });
    persist("customDocs");
    renderDocuments();
  });
  document.querySelectorAll("#main [data-field]").forEach(el=>{
    const evt = el.tagName === "SELECT" ? "change" : "input";
    el.addEventListener(evt, ()=>{
      const id = el.dataset.id, field = el.dataset.field;
      if(!overrides.docs[id]) overrides.docs[id] = {};
      overrides.docs[id][field] = el.value;
      persist("docs");
      if(field === "status"){
        const pill = document.getElementById("doc-pill-"+id);
        const colors = { "Not Started":"var(--text-faint)","Drafting":"var(--amber)","Needs Tailoring":"var(--amber)","Ready":"var(--green)" };
        if(pill){
          pill.textContent = el.value;
          pill.style.color = colors[el.value];
          pill.style.borderColor = colors[el.value] + "44";
          pill.style.background = colors[el.value] + "18";
        }
      }
    });
  });
  document.querySelectorAll("#main [data-custom-field][data-id]").forEach(el=>{
    el.addEventListener("input", ()=>{
      const cd = overrides.customDocs.find(x=>x.id===el.dataset.id);
      if(cd){ cd[el.dataset.customField] = el.value; persist("customDocs"); }
    });
  });
  document.querySelectorAll("#main [data-remove-doc]").forEach(el=>{
    el.addEventListener("click", ()=>{
      const id = el.dataset.removeDoc;
      const d = getAllDocs().find(x=>x.id===id);
      if(!confirm(`Remove "${d ? d.name : 'this document'}"? This can't be undone.`)) return;
      if(isCustom(id)){
        overrides.customDocs = overrides.customDocs.filter(x=>x.id!==id);
        persist("customDocs");
      } else {
        overrides.removed.docs.push(id);
        persist("removed");
      }
      renderDocuments();
    });
  });
}

function renderScholarships(){
  const search = (ui.schSearch||"").toLowerCase();
  const list = getAllScholarships().filter(s=>{
    if(!search) return true;
    return s.name.toLowerCase().includes(search) || s.uni.toLowerCase().includes(search);
  }).slice().sort((a,b)=>{
    const da = getSch(a).deadline, db = getSch(b).deadline;
    if(da && db) return da < db ? -1 : 1;
    if(da) return -1;
    if(db) return 1;
    return a.name.localeCompare(b.name);
  });
  document.getElementById("main").innerHTML = `
    <div class="page-head">
      <h1>Scholarships</h1>
      <p>${getAllScholarships().length} applications across ${SCHOLARSHIP_GROUPS.length} funds — one row per university, since each runs its own process. Sorted by deadline.</p>
    </div>
    <div class="toolbar">
      <input type="text" class="search" id="schSearch" placeholder="Search scholarship or university…" value="${esc(ui.schSearch||"")}">
      <div class="spacer"></div>
      <span style="font-size:12px; color:var(--text-faint); font-family:var(--mono);">${list.length} shown</span>
      <button class="btn small" id="addSch">+ Add scholarship</button>
    </div>
    <div id="schList">${list.map(renderSchCard).join("")}</div>
  `;
  document.getElementById("addSch").addEventListener("click", ()=>{
    const id = "cs_" + Date.now();
    overrides.customScholarships.push({ id, name:"New scholarship", uni:"", notes:"", researchedDeadline:"", confidence:"unverified" });
    persist("customScholarships");
    renderScholarships();
  });
  document.getElementById("schSearch").addEventListener("input", e=>{ ui.schSearch = e.target.value; renderScholarships(); });
  document.querySelectorAll("#schList [data-field]").forEach(el=>{
    const evt = (el.tagName === "SELECT" || el.type === "date" || el.type === "checkbox") ? "change" : "input";
    el.addEventListener(evt, ()=>{
      const id = el.dataset.id, field = el.dataset.field;
      if(!overrides.scholarships[id]) overrides.scholarships[id] = {};
      overrides.scholarships[id][field] = el.type === "checkbox" ? el.checked : el.value;
      persist("scholarships");
      if(field === "response"){
        const pill = document.getElementById("resp-pill-"+id);
        if(pill){ pill.textContent = el.value; pill.className = "status-pill resp-" + el.value.replace(/\s+/g,'-'); }
      }
    });
  });
  document.querySelectorAll("#schList [data-custom-field][data-id]").forEach(el=>{
    el.addEventListener("input", ()=>{
      const cs = overrides.customScholarships.find(x=>x.id===el.dataset.id);
      if(cs){ cs[el.dataset.customField] = el.value; persist("customScholarships"); }
    });
  });
  document.querySelectorAll("#schList [data-remove-sch]").forEach(el=>{
    el.addEventListener("click", ()=>{
      const id = el.dataset.removeSch;
      const s = getAllScholarships().find(x=>x.id===id);
      if(!confirm(`Remove "${s ? s.name + ' — ' + s.uni : 'this scholarship'}"? This can't be undone.`)) return;
      if(isCustom(id)){
        overrides.customScholarships = overrides.customScholarships.filter(x=>x.id!==id);
        persist("customScholarships");
      } else {
        overrides.removed.scholarships.push(id);
        persist("removed");
      }
      renderScholarships();
    });
  });
}

      <div class="field"><label>Application deadline</label>
        <input type="date" data-field="deadline" data-id="${s.id}" value="${g.deadline||''}">
      </div>
      <div class="field"><label>Decision date</label>
        <input type="date" data-field="decisionDate" data-id="${s.id}" value="${g.decisionDate||''}">
      </div>
      <div class="field"><label>Funding coverage</label>
        <input type="text" data-field="fundingCoverage" data-id="${s.id}" value="${esc(g.fundingCoverage)}" placeholder="e.g. full tuition">
      </div>
    </div>
    <label style="display:flex; align-items:center; gap:7px; margin-top:10px; font-size:12.5px; color:var(--text-dim);">
      <input type="checkbox" data-field="eligibilityConfirmed" data-id="${s.id}" ${g.eligibilityConfirmed?'checked':''}> Eligibility confirmed with provider
    </label>
    <textarea class="notes" data-field="notes" data-id="${s.id}">${esc(g.notes)}</textarea>
    <div style="margin-top:10px;">
      <button class="btn danger small" data-remove-sch="${s.id}">Remove this scholarship</button>
    </div>
  </div>`;
}

/* ============================================================
   CONTACTS
   ============================================================ */

function renderContacts(){
  document.getElementById("main").innerHTML = `
    <div class="page-head">
      <h1>Contacts</h1>
      <p>People you're in touch with at each institution.</p>
    </div>
    <div id="contactList">${overrides.contacts.map(renderContactCard).join("")}</div>
    <button class="btn ghost" id="addContact">+ Add contact</button>
  `;
  document.getElementById("addContact").addEventListener("click", ()=>{
    overrides.contacts.push({ id:"con_"+Date.now(), name:"New contact", email:"", program:"", role:"", notes:"" });
    persist("contacts");
    renderContacts();
  });
  document.querySelectorAll("#contactList [data-field]").forEach(el=>{
    el.addEventListener("input", ()=>{
      const idx = overrides.contacts.findIndex(c=>c.id===el.dataset.id);
      if(idx>-1){ overrides.contacts[idx][el.dataset.field] = el.value; persist("contacts"); }
    });
  });
  document.querySelectorAll("#contactList [data-remove]").forEach(el=>{
    el.addEventListener("click", ()=>{
      overrides.contacts = overrides.contacts.filter(c=>c.id!==el.dataset.remove);
      persist("contacts");
      renderContacts();
    });
  });
}

function renderContactCard(c){
  const initials = (c.name||"?").split(" ").map(w=>w[0]).slice(0,2).join("").toUpperCase();
  return `
  <div class="contact-card">
    <div class="avatar">${esc(initials)}</div>
    <div style="flex:1; min-width:220px; display:grid; grid-template-columns:1fr 1fr; gap:8px;">
      <input type="text" class="field" data-field="name" data-id="${c.id}" value="${esc(c.name)}" placeholder="Name">
      <input type="text" class="field" data-field="email" data-id="${c.id}" value="${esc(c.email)}" placeholder="Email">
      <input type="text" class="field" data-field="program" data-id="${c.id}" value="${esc(c.program)}" placeholder="Program / university">
      <input type="text" class="field" data-field="role" data-id="${c.id}" value="${esc(c.role)}" placeholder="Role">
    </div>
    <textarea class="notes" style="flex:1; min-width:220px;" data-field="notes" data-id="${c.id}" placeholder="Notes…">${esc(c.notes)}</textarea>
    <button class="btn danger small" data-remove="${c.id}">Remove</button>
  </div>`;
}

/* ============================================================
   GUIDE
   ============================================================ */

function renderGuide(){
  const items = [
    ["Status", "Wishlist → Preparing → Submitted → Interview → Offer → Accepted / Rejected / Declined. Click a program to expand it, then change Status there — it updates immediately."],
    ["Shared documents", "Transcript, both required LORs, Duolingo, Oxford ELLT, MOI letter, graduation letter and CV are used by almost every program. Update them once on the Documents tab instead of 26 times. Two extra LOR slots are tracked too but don't count toward the readiness ring, since not every program asks for more than two."],
    ["Personal statement", "The Documents tab holds the general base draft everyone starts from. Each program also needs its own tailored paragraph — that's tracked per-program on the Programs tab, and the aggregate shows at the top of Documents."],
    ["MOI", "Medium of Instruction letter — proof your degree was taught in English, sometimes accepted instead of an English test. \"Yes\" means UCAS can issue one; \"Maybe\"/\"Highly Maybe\" means it's unconfirmed."],
    ["Duolingo / Oxford ELLT", "Minimum scores each program has set. Log your actual score once you sit the test and the card shows target vs. actual side by side. The Documents tab separately tracks whether you've obtained the official score report itself."],
    ["Scholarships", "Split one row per university, since each runs its own application even when the same foundation funds several schools. Deadlines are tagged: confirmed (published for your 2027/28 cycle), estimated (last cycle's date shifted forward a year), or not found — verify directly with the provider."],
    ["Portals", "Programs with a known link show an \"Open portal\" button. Programs where the portal isn't public yet show a countdown; paste a link in once you find one and it becomes a button."],
    ["Saving", "Everything you type is saved automatically — reopen this file anytime and your data will be there."],
  ];
  document.getElementById("main").innerHTML = `
    <div class="page-head"><h1>Guide</h1><p>How this tracker is put together.</p></div>
    <div class="panel">
      ${items.map(([h,t])=>`<div class="guide-item"><h3>${esc(h)}</h3><p>${esc(t)}</p></div>`).join("")}
    </div>
  `;
}

/* ============================================================
   RENDER ROUTER
   ============================================================ */

function render(){
  renderNav();
  if(ui.tab==="dashboard") renderDashboard();
  else if(ui.tab==="programs") renderPrograms();
  else if(ui.tab==="documents") renderDocuments();
  else if(ui.tab==="scholarships") renderScholarships();
  else if(ui.tab==="contacts") renderContacts();
  else if(ui.tab==="guide") renderGuide();
}

/* ============================================================
   EXPORT / IMPORT — carry your data between browsers, laptops, people
   ============================================================ */

function exportData(){
  const payload = {
    _type: "gradtrack-backup", exportedAt: new Date().toISOString(),
    programs: overrides.programs, docs: overrides.docs, scholarships: overrides.scholarships,
    contacts: overrides.contacts, customPrograms: overrides.customPrograms,
    customDocs: overrides.customDocs, customScholarships: overrides.customScholarships,
    removed: overrides.removed,
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "grad-tracker-backup-" + new Date().toISOString().slice(0,10) + ".json";
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

async function importDataFromFile(file){
  let data;
  try{
    data = JSON.parse(await file.text());
  }catch(e){
    alert("That file doesn't look like a valid backup — couldn't read it as JSON.");
    return;
  }
  if(!data || typeof data !== "object"){
    alert("That file doesn't look like a valid backup.");
    return;
  }
  if(!confirm("Importing will replace everything currently in this tracker with the backup's data. Continue?")) return;

  overrides.programs = data.programs || {};
  overrides.docs = data.docs || {};
  overrides.scholarships = data.scholarships || {};
  overrides.contacts = data.contacts || CONTACTS.slice();
  overrides.customPrograms = data.customPrograms || [];
  overrides.customDocs = data.customDocs || [];
  overrides.customScholarships = data.customScholarships || [];
  overrides.removed = data.removed || { programs: [], docs: [], scholarships: [] };

  persist("programs"); persist("docs"); persist("scholarships"); persist("contacts");
  persist("customPrograms"); persist("customDocs"); persist("customScholarships"); persist("removed");
  ui = { tab:"dashboard", search:"", statusFilter:"All", openProgram:null, schSearch:"" };
  render();
  alert("Backup imported.");
}

document.getElementById("exportBtn").addEventListener("click", exportData);
document.getElementById("importBtn").addEventListener("click", ()=> document.getElementById("importFile").click());
document.getElementById("importFile").addEventListener("change", e=>{
  const file = e.target.files[0];
  if(file) importDataFromFile(file);
  e.target.value = "";
});

loadAll();

})();
</script>
